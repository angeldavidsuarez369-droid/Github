<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Altiplano - Reservas</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/tipografia.css">
    <link rel="stylesheet" href="css/cajas.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>

    <header class="header">
        <div class="header__contenedor">
            <h2 class="header__logo">☕ Café Altiplano</h2>
            <nav class="nav">
                <ul class="nav__lista">
                    <li><a href="index.html" class="nav__enlace">Inicio</a></li>
                    <li><a href="carta.html" class="nav__enlace">Carta</a></li>
                    <li><a href="sedes.html" class="nav__enlace">Sedes</a></li>
                    <li><a href="reservas.html" class="nav__enlace nav__enlace--activo">Reservas</a></li>
                    <li><a href="nosotros.html" class="nav__enlace">Nosotros</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="seccion">
            <h1>Reserva una Mesa</h1>
            <p>Asegura tu espacio para disfrutar de una gran taza de café.</p>

            <form action="#" method="POST" class="formulario">
                <fieldset>
                    <legend>Detalles de tu reserva</legend>

                    <div class="form__grupo">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="form__grupo">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="form__grupo">
                        <label for="sede">Sede:</label>
                        <select id="sede" name="sede" required>
                            <option value="">-- Selecciona una opción --</option>
                            <option value="centro">Centro Histórico</option>
                            <option value="norte">Zona Norte</option>
                        </select>
                    </div>

                    <div class="form__grupo">
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="form__grupo">
                        <label>Motivo:</label>
                        <label><input type="radio" name="motivo" value="personal" checked> Personal</label>
                        <label><input type="radio" name="motivo" value="trabajo"> Trabajo</label>
                    </div>

                    <div class="form__grupo">
                        <label>
                            <input type="checkbox" name="terminos" required> Acepto términos y condiciones
                        </label>
                    </div>

                    <div class="form__grupo">
                        <label for="comentarios">Comentarios:</label>
                        <textarea id="comentarios" name="comentarios" rows="3" placeholder="Algo que debamos saber..."></textarea>
                    </div>

                    <button type="submit" class="boton">Confirmar Reserva</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Café Altiplano. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
